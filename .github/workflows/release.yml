name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Validate dictionaries & run tests
        run: |
          npm run check:dict
          npm test

      - name: Build portable zip archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR="antigravity-zh-cn-${TAG}"
          mkdir -p "${PKG_DIR}"
          cp -r bin dicts plugin scripts src LICENSE README.md README.en.md THIRD_PARTY_NOTICES.md package.json "${PKG_DIR}/"
          zip -r "antigravity-zh-cn-${TAG}.zip" "${PKG_DIR}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: antigravity-zh-cn-${{ github.ref_name }}.zip
          generate_release_notes: true
